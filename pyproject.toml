[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copperlane-cv-builder"
version = "0.1.0"
description = "Deterministic 1-page CV & 300 DPI PNG generator for Copperlane"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.21.2",
    "PyMuPDF>=2.0",
    "reportlab>=5.1.0",
    "Pillow>=12.3.0",
]
